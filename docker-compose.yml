services:
  db:
    image: postgres:16
    container_name: precioscr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: precioscr
      POSTGRES_PASSWORD: precioscr123
      POSTGRES_DB: precioscr
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: